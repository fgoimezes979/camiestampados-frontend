<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-xl-10">

      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Editar producto</h4>
        </div>

        <form [formGroup]="productForm" (ngSubmit)="onSubmit()">

          <div class="card-body">
            <div class="row g-4">

              <!-- 🔹 COLUMNA IZQUIERDA: FORMULARIO -->
              <div class="col-md-7">

                <div class="row g-3">

                  <div class="col-md-6">
                    <label class="form-label">ID</label>
                    <input class="form-control" formControlName="id" readonly>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">Código</label>
                    <input class="form-control" formControlName="code" readonly>
                  </div>

                  <div class="col-12">
                    <label class="form-label">Nombre</label>
                    <input class="form-control" formControlName="name">
                  </div>

                  <div class="col-12">
                    <label class="form-label">Categoría</label>
                    <input class="form-control" formControlName="category">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">Cantidad</label>
                    <input type="number" class="form-control" formControlName="quantity">
                  </div>

                  <div class="col-md-6 d-flex align-items-end">
                    <div class="form-check form-switch">
                      <input class="form-check-input" type="checkbox" formControlName="isActive">
                      <label class="form-check-label">Activo</label>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">Precio compra</label>
                    <input type="number" class="form-control" formControlName="purchasePrice">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">Precio venta</label>
                    <input type="number" class="form-control" formControlName="salePrice">
                  </div>

                  <div class="col-12">
                    <label class="form-label">Proveedor</label>
                    <!-- Proveedor con select -->
                    <select class="form-control" formControlName="supplierId">
                      <option value="" disabled>Seleccione proveedor</option>
                      <option *ngFor="let sup of suppliers" [value]="sup.id">
                        {{ sup.name }} ({{ sup.code }})
                      </option>
                    </select>
                  </div>

                  <div class="col-12">
                    <label class="form-label">Imagen (ruta)</label>
                    <input
                      class="form-control"
                      formControlName="image"
                      placeholder="assets/img/prod-1.jpg">
                  </div>

                </div>
              </div>

              <!-- 🔹 COLUMNA DERECHA: IMAGEN GRANDE -->
              <div class="col-md-5 d-flex flex-column align-items-center">

                <label class="form-label">Vista previa</label>

                <div
                  class="border rounded d-flex align-items-center justify-content-center bg-light"
                  style="width: 100%; height: 360px; max-height: 360px; overflow: hidden;"
                >
                  <img
                    *ngIf="productForm.value.image; else noImage"
                    [src]="productForm.value.image"
                    class="img-fluid rounded"
                    style="width: 100%; height: 100%; object-fit: contain;"
                    alt="Imagen del producto"
                  >

                  <ng-template #noImage>
                    <span class="text-muted text-center">
                      Selecciona una imagen<br>
                      para verla aquí
                    </span>
                  </ng-template>
                </div>

              </div>

            </div>
          </div>

          <!-- FOOTER -->
          <div class="card-footer d-flex justify-content-end bg-light">
            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="productForm.invalid">
              <i class="fas fa-save me-1"></i>
              Guardar cambios
            </button>
          </div>

        </form>

      </div>

    </div>
  </div>
</div>
