<!-- Content Wrapper -->
<div class="content-wrapper">

  <!-- Page Header -->
  <section class="content-header">
    <div class="container-fluid">
      <div class="row mb-3">
        <div class="col-sm-6">
          <h1 class="font-weight-bold">Ubicaciones</h1>
        </div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a routerLink="/dashboard">Dashboard</a></li>
            <li class="breadcrumb-item active">Listado</li>
          </ol>
        </div>
      </div>
    </div>
  </section>

  <!-- Card -->
  <section class="content">
    <div class="card shadow-sm">

      <!-- Header -->
      <div class="card-header d-flex justify-content-between align-items-center">
        <h3 class="card-title mb-0">
          <i class="fas fa-store-alt mr-1"></i> Listado de Tiendas / Ubicaciones
        </h3>

        <a [routerLink]="['/locations/create']" class="btn btn-success btn-sm">
          <i class="fas fa-plus"></i> Nueva Ubicación
        </a>
      </div>

      <!-- Body -->
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover table-bordered text-center">
            <thead class="thead-dark">
              <tr>
                <th style="width:10%">Código</th>
                <th style="width:20%">Nombre</th>
                <th style="width:30%">Descripción</th>
                <th style="width:10%">Capacidad</th>
                <th style="width:5%">Activo</th>
                <th style="width:25%">Acciones</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let location of locations">

                <td>{{ location.code }}</td>
                <td>{{ location.name }}</td>

                <!-- Descripción completa y responsiva -->
                <td style="white-space: normal; word-break: break-word;" 
                    [title]="location.description">
                  {{ location.description }}
                </td>

                <td>{{ location.ability }}</td>

                <td>
                  <span 
                    [class]="location.isActive ? 'badge badge-success' : 'badge badge-secondary'">
                    {{ location.isActive ? 'Sí' : 'No' }}
                  </span>
                </td>

                <td>
                  <a [routerLink]="['/locations/show', location.id]" 
                     class="btn btn-info btn-sm mr-1" title="Ver">
                    <i class="fas fa-eye"></i>
                  </a>

                  <a [routerLink]="['/locations/edit', location.id]" 
                     class="btn btn-warning btn-sm mr-1" title="Editar">
                    <i class="fas fa-edit"></i>
                  </a>

                  <button class="btn btn-danger btn-sm" 
                          (click)="deleteLocation(location.id)" title="Eliminar">
                    <i class="fas fa-trash"></i>
                  </button>
                </td>

              </tr>
            </tbody>

          </table>
        </div>
      </div>

    </div>
  </section>

</div>
