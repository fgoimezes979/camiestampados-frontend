<div class="container mt-4" *ngIf="user as u; else loading">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h3 class="card-title mb-0">Detalles del Usuario</h3>
    </div>

    <div class="card-body">
      <div class="row align-items-center">
        
        

        <!-- INFO -->
        <div class="col-md-9">
          <ul class="list-unstyled mb-0">
            <li><strong>Primer Nombre:</strong> {{ u.firstname }}</li>
            <li><strong>Segundo Nombre:</strong> {{ u.secondname }}</li>
            <li><strong>Primer Apellido:</strong> {{ u.firstlastname }}</li>
            <li><strong>Segundo Apellido:</strong> {{ u.secondlastname }}</li>
            <!-- FOTO -->
        <div class="col-md-3 text-center">
          <img 
            [src]="u.photo || 'assets/img/avatar4.png'" 
            alt="Foto de usuario" 
            class="img-fluid rounded-circle border mb-3 shadow-sm"
            width="150"
            height="150">
        </div>
            
            
            <li><strong>Email:</strong> {{ u.email }}</li>
            
            <li>
              <strong>Activo:</strong> 
              <span [ngClass]="{ 'text-success': u.is_active!, 'text-danger': !u.is_active! }">
                {{ u.is_active ? 'Sí' : 'No' }}
              </span>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div class="card-footer text-end">
      <a routerLink="/users" class="btn btn-secondary btn-sm">
        <i class="fas fa-arrow-left"></i> Volver
      </a>
    </div>
  </div>
</div>

<!-- 👇 Aquí declaras el template con el mismo nombre -->
<ng-template #loading>
  <div class="text-center mt-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2">Cargando usuario...</p>
  </div>
</ng-template>
