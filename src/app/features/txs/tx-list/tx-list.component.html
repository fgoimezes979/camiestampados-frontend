<div class="operation-list-container">
  <h2>📊 Lista de Movimientos</h2>

  <table class="operation-table">
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Descripción</th>
        <th>Usuario</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let op of txs">
        <td>{{ op.date | date:'dd/MM/yyyy' }}</td>
        <td>{{ op.description }}</td>
        <td>{{ op.user }}</td>
      </tr>
    </tbody>
  </table>
</div>
